[project]
name = "memos"
version = "0.1.0"
description = "MemOS - Memory Operating System with Evaluation Dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0",
    "openai>=1.0.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "pymilvus>=2.5.0",
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "layer1: single-session recall tests",
    "layer2: multi-session synthesis tests",
    "layer3: cross-domain proactive tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/os_mem", "src/testing"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["os_mem", "testing", "eval"]
